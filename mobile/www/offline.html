<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ArcadeHub</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a0f; color: #eee; font-family: -apple-system, system-ui, sans-serif; }
    body { display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); box-sizing: border-box; text-align: center; }
    img { width: 92px; height: 92px; border-radius: 22px; margin-bottom: 22px; }
    h1 { font-size: 1.6rem; letter-spacing: .08em; margin: 0 0 .5rem; }
    p { margin: 0 auto 1.75rem; max-width: 300px; line-height: 1.5; color: #9a9aaa; }
    button { font: inherit; font-weight: 700; letter-spacing: .08em; color: #fff; border: 0; border-radius: 10px; padding: .9rem 2rem; background: #e74c3c; }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="" />
    <h1>YOU'RE OFFLINE</h1>
    <p>ArcadeHub needs an internet connection. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" id="retry">TRY AGAIN</button>
  </main>
  <script>document.getElementById('retry').onclick = () => { location.href = 'https://arcardehub-production-e3de.up.railway.app/'; };</script>
</body>
</html>
